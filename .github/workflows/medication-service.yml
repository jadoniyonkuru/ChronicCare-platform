name: medication-service

on:
  push:
    branches: [main]
    paths:
      - 'services/medication-service/**'
      - '.github/workflows/medication-service.yml'
  pull_request:
    paths:
      - 'services/medication-service/**'
      - '.github/workflows/medication-service.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chroniccare
          POSTGRES_PASSWORD: chroniccare
          POSTGRES_DB: chroniccare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chroniccare -d chroniccare_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: services/medication-service

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/medication-service/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:int
        env:
          TEST_DATABASE_URL: postgres://chroniccare:chroniccare@localhost:5432/chroniccare_test
      - run: npm run build
