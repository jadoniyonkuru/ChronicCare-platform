name: medication-service

on:
  push:
    branches: [main]
    paths:
      - 'backend/medication-service/**'
      - '.github/workflows/medication-service.yml'
      - 'docker-compose.yml'
      - 'infrastructure/docker/**'
  pull_request:
    paths:
      - 'backend/medication-service/**'
      - '.github/workflows/medication-service.yml'
      - 'docker-compose.yml'
      - 'infrastructure/docker/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chroniccare
          POSTGRES_PASSWORD: chroniccare
          POSTGRES_DB: chroniccare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chroniccare -d chroniccare_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend/medication-service

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/medication-service/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:int
        env:
          TEST_DATABASE_URL: postgres://chroniccare:chroniccare@localhost:5432/chroniccare_test
      - run: npm run build

  docker:
    name: Docker image and full-stack smoke test
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v7

      - name: Build and start PostgreSQL and the service
        run: docker compose up -d --build --wait

      - name: Smoke test the running API
        run: |
          set -euo pipefail
          base=http://localhost:3001
          patient=5f0c7a1e-8a51-4a8e-9a4b-1f7c3a2b9d01

          yesterday=$(date -u -d yesterday +%F)
          json=(-H "Content-Type: application/json")

          curl -fsS "$base/health"
          curl -fsS -o /dev/null "$base/docs"

          body=$(jq -nc --arg start "$yesterday" \
            '{name: "Metformin", dosage: "500 mg", timesOfDay: ["08:00"], startDate: $start}')
          id=$(curl -fsS -X POST "${json[@]}" -d "$body" \
            "$base/api/v1/patients/$patient/medications" | jq -r .id)

          curl -fsS -X PUT "${json[@]}" -d '{"status": "taken"}' \
            "$base/api/v1/patients/$patient/medications/$id/doses/$yesterday/08:00"

          adherence=$(curl -fsS "$base/api/v1/patients/$patient/adherence")
          echo "$adherence"
          test "$(echo "$adherence" | jq .adherencePercent)" = "100"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v
