name: full-stack

# Builds every service's Docker image, starts the whole backend with Docker
# Compose exactly as a developer would, and exercises it over HTTP.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'infrastructure/docker/**'
      - '.github/workflows/stack.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'infrastructure/docker/**'
      - '.github/workflows/stack.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build and start the backend
        run: docker compose up -d --build --wait

      - name: Auth service
        run: |
          set -euo pipefail
          auth=http://localhost:3002/api/v1/auth
          json=(-H "Content-Type: application/json")

          curl -fsS http://localhost:3002/health
          curl -fsS -o /dev/null http://localhost:3002/docs

          curl -fsS -X POST "${json[@]}" "$auth/register" \
            -d '{"email": "ci@example.com", "password": "ci passphrase 123", "fullName": "CI User"}' > /dev/null
          token=$(curl -fsS -X POST "${json[@]}" "$auth/login" \
            -d '{"email": "ci@example.com", "password": "ci passphrase 123"}' | jq -r .accessToken)
          curl -fsS "$auth/me" -H "Authorization: Bearer $token" | jq -e '.role == "patient"'

          # A wrong password must be rejected.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${json[@]}" "$auth/login" \
            -d '{"email": "ci@example.com", "password": "wrong passphrase"}')
          test "$status" = "401"

      - name: Medication service
        run: |
          set -euo pipefail
          base=http://localhost:3001
          patient=5f0c7a1e-8a51-4a8e-9a4b-1f7c3a2b9d01
          yesterday=$(date -u -d yesterday +%F)
          json=(-H "Content-Type: application/json")

          curl -fsS "$base/health"
          curl -fsS -o /dev/null "$base/docs"

          body=$(jq -nc --arg start "$yesterday" \
            '{name: "Metformin", dosage: "500 mg", timesOfDay: ["08:00"], startDate: $start}')
          id=$(curl -fsS -X POST "${json[@]}" -d "$body" \
            "$base/api/v1/patients/$patient/medications" | jq -r .id)

          curl -fsS -X PUT "${json[@]}" -d '{"status": "taken"}' \
            "$base/api/v1/patients/$patient/medications/$id/doses/$yesterday/08:00"

          curl -fsS "$base/api/v1/patients/$patient/adherence" | jq -e '.adherencePercent == 100'

      - name: Demo data
        run: |
          set -euo pipefail
          docker compose exec -T auth-service node dist/database/seed.js
          docker compose exec -T medication-service node dist/database/seed.js

          curl -fsS -X POST -H "Content-Type: application/json" http://localhost:3002/api/v1/auth/login \
            -d '{"email": "patient@demo.chroniccare.dev", "password": "demo-password-2026"}' \
            | jq -e '.user.id == "5f0c7a1e-8a51-4a8e-9a4b-1f7c3a2b9d01"'
          curl -fsS "http://localhost:3001/api/v1/patients/5f0c7a1e-8a51-4a8e-9a4b-1f7c3a2b9d01/adherence" \
            | jq -e '.adherencePercent > 0 and (.medications | length) == 3'

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v
