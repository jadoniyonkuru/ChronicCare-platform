# Runs the whole backend locally.
#   Everything:         docker compose up -d --build
#   Only the database:  docker compose up -d postgres   (when running the API with npm)
# Credentials and the JWT secret below are for local development only.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: chroniccare
      POSTGRES_PASSWORD: chroniccare
      POSTGRES_DB: chroniccare
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chroniccare -d chroniccare']
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./backend/auth-service
    environment:
      DATABASE_URL: postgres://chroniccare:chroniccare@postgres:5432/chroniccare_auth
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-0123456789}
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy

  medication-service:
    build: ./backend/medication-service
    environment:
      DATABASE_URL: postgres://chroniccare:chroniccare@postgres:5432/chroniccare
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-0123456789}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
