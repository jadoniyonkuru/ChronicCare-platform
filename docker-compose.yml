# Local development infrastructure. Start with: docker compose up -d
# Credentials below are for local development only.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: chroniccare
      POSTGRES_PASSWORD: chroniccare
      POSTGRES_DB: chroniccare
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chroniccare -d chroniccare']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
